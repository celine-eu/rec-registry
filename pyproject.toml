[project]
name = "celine-rec-registry"
version = "1.3.4"
description = "CELINE REC Registry microservice (read-only JSON-LD API)"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "CELINE"}]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "sqlalchemy>=2.0",
  "asyncpg>=0.29",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "typer>=0.12",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "httpx>=0.28.1",
  "celine-sdk>=1.6.0",
]

[project.scripts]
celine-rec-registry = "celine.rec_registry.cli.main:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/celine/rec_registry"]
sources = {"src" = ""}

[dependency-groups]
dev = [
    "python-semantic-release>=10.5.3",
    "debugpy>=1.8.16",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]

build_command = """
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
    uv build
"""

branch = "main"
changelog_file = "CHANGELOG.md"
tag_format = "v{version}"
commit_parser = "conventional"

upload_to_release = false
upload_to_pypi = false
commit_version_number = false

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "up"]
parse_squash_commits = true
ignore_merge_commits = true

