volumes:
  pgdata:

services:
  api:
    command: >-
      sh -lc "uv run alembic upgrade head && .venv/bin/uvicorn celine.rec_registry.main:create_app --host 0.0.0.0 --port 8004"
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8004:8004"
    restart: unless-stopped
    volumes:
      - ./recs:/app/recs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8004/health'').read();"',
        ]
      interval: 5s
      timeout: 3s
      retries: 30
    extra_hosts:
      - "keycloak.celine.localhost:172.17.0.1"
      - "api.celine.localhost:172.17.0.1"
