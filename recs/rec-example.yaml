# =============================================================================
# CELINE REC Registry (v0.4 Schema) - Example
# =============================================================================
#
# This is a PUBLIC, FICTIONAL example of a Renewable Energy Community registry.
#
# The v0.4 schema is a simplified, flat model designed for operational use:
#   - community: REC definition with embedded geographic areas
#   - members: dict of participants keyed by member ID
#   - assets: nested within each member, organized by type
#
# Key principles:
#   - Simple string identifiers (no IRIs/CURIEs)
#   - Hierarchical structure (community -> members -> assets)
#   - Type-specific asset collections (pv, storage, meter, etc.)
#   - Relationships expressed as asset key references
#
# =============================================================================

# -----------------------------------------------------------------------------
# VERSION & SCHEMA
# -----------------------------------------------------------------------------
# version: Registry format version (for tooling compatibility)
# schema_version: Schema definition version this file conforms to

version: "1.0"
schema_version: "1.0"

# -----------------------------------------------------------------------------
# METADATA (optional)
# -----------------------------------------------------------------------------
# Operational metadata about this registry file.
#
# Fields:
#   created: Date the registry was first created (YYYY-MM-DD)
#   updated: Date of last modification (YYYY-MM-DD)
#   updated_by: Identifier of person/system that made the last update
#   description: Human-readable description of this registry

metadata:
  created: "2025-01-15"
  updated: "2025-02-08"
  updated_by: "registry-admin"
  description: "Aurora Valley REC - fictional example for documentation"

# -----------------------------------------------------------------------------
# COMMUNITY
# -----------------------------------------------------------------------------
# The Renewable Energy Community definition.
#
# Fields:
#   id: Unique identifier for the community (used as primary key)
#   name: Human-readable display name
#   description: Longer description of the community
#   areas: Geographic areas within the community (dict keyed by area ID)
#
# Areas:
#   Each area has a name and location (lat/lon coordinates).
#   Members reference areas by their key.

community:
  id: aurora_valley_rec
  name: Aurora Valley Renewable Energy Community
  description: >
    A fictional REC spanning the Aurora Valley region, including residential
    prosumers, consumers, and community-owned assets. Used as a public example
    for CELINE registry documentation.

  areas:
    # Northern residential zone - mostly single-family homes with PV
    av_north:
      name: Aurora Valley North
      location:
        lat: 46.0512
        lon: 11.1234

    # Southern zone - mix of apartments and small businesses
    av_south:
      name: Aurora Valley South
      location:
        lat: 46.0234
        lon: 11.1456

    # Industrial/commercial zone
    av_industrial:
      name: Aurora Valley Industrial Park
      location:
        lat: 46.0678
        lon: 11.0987

# -----------------------------------------------------------------------------
# MEMBERS
# -----------------------------------------------------------------------------
# Community members (participants), keyed by member ID.
#
# Each member has:
#   user_id: External system identifier (e.g., POD code, SSO subject, CRM ID)
#   name: Display name
#   role: Member's role in the community
#         Values: consumer | prosumer | producer | operator | admin
#   area: Reference to a community area key
#   status: Membership status
#           Values: pending | active | suspended | inactive
#   assets: Collection of assets owned by this member (optional)
#
# Assets are organized by type within each member:
#   pv: Photovoltaic systems
#   storage: Battery storage systems
#   meter: Energy meters
#   ev_charger: Electric vehicle charging stations
#   heat_pump: Heat pump systems
#   load: Controllable loads
#
# Each asset type is a dict keyed by asset ID.

members:
  # ---------------------------------------------------------------------------
  # OPERATOR
  # ---------------------------------------------------------------------------
  # The community operator manages the REC and may own shared assets.

  op-001:
    user_id: "aurora-grid-services"
    name: Aurora Grid Services Ltd.
    role: operator
    area: av_north
    status: active
    # Operator has no personal assets in this example
    # (community-owned assets would be handled separately)

  # ---------------------------------------------------------------------------
  # PROSUMER - Full setup with PV, storage, and meter
  # ---------------------------------------------------------------------------
  # A prosumer both consumes and produces energy.
  # This member has a complete setup: PV system, battery storage, and meter.

  av-0001:
    user_id: "POD-IT000E012345678"
    name: Alex Rivers
    role: prosumer
    area: av_north
    status: active

    assets:
      # -----------------------------------------------------------------------
      # PV System
      # -----------------------------------------------------------------------
      # Photovoltaic installation.
      #
      # Fields:
      #   name: Display name
      #   rated_power: Nominal peak power in kW (kWp)
      #   panel_type: Technology type
      #               Values: monocrystalline | polycrystalline | thin_film
      #   inverter_power: Maximum inverter output in kW
      #   orientation: Azimuth angle in degrees (0=North, 90=East, 180=South, 270=West)
      #   tilt_angle: Panel tilt from horizontal in degrees (0-90)
      #   installation_date: When the system was installed (YYYY-MM-DD)
      #   relationships.measures: List of asset keys that measure this asset

      pv:
        pv-av-0001:
          name: Rooftop PV System
          rated_power: 6.4
          panel_type: monocrystalline
          inverter_power: 6.0
          orientation: 180 # South-facing
          tilt_angle: 30
          installation_date: "2024-03-15"
          relationships:
            measures:
              - meter-av-0001 # This PV is measured by meter-av-0001

      # -----------------------------------------------------------------------
      # Battery Storage
      # -----------------------------------------------------------------------
      # Battery energy storage system.
      #
      # Fields:
      #   name: Display name
      #   capacity: Total energy storage capacity in kWh
      #   max_charge_power: Maximum charging power in kW
      #   max_discharge_power: Maximum discharging power in kW
      #   battery_type: Battery technology
      #                 Values: lithium_ion | lead_acid | flow_battery | sodium_ion | other
      #   round_trip_efficiency: Efficiency percentage (0-100)
      #   installation_date: When installed (YYYY-MM-DD)
      #   relationships.measures: Asset keys that measure this storage
      #   relationships.paired_with: Asset key this storage is paired with (e.g., PV)

      storage:
        bat-av-0001:
          name: Home Battery
          capacity: 10.0
          max_charge_power: 5.0
          max_discharge_power: 5.0
          battery_type: lithium_ion
          round_trip_efficiency: 92
          installation_date: "2024-03-15"
          relationships:
            measures:
              - meter-av-0001
            paired_with: pv-av-0001 # Paired with the PV system

      # -----------------------------------------------------------------------
      # Meter
      # -----------------------------------------------------------------------
      # Energy meter (smart meter, sub-meter, etc.)
      #
      # Fields:
      #   name: Display name
      #   sensor_id: Unique identifier used by data ingestion pipelines
      #              This is the key for time-series data lookup
      #   meter_type: Type of energy flow measured
      #               Values: consumption | production | bidirectional | import | export
      #   protocol: Communication protocol (optional)
      #             Values: modbus | mqtt | rest_api | m-bus | dlms | other
      #   installation_date: When installed (YYYY-MM-DD)
      #   relationships.measures: Asset keys that this meter measures

      meter:
        meter-av-0001:
          name: Smart Meter M-0001
          sensor_id: sensor-abc-001
          meter_type: bidirectional
          protocol: dlms
          installation_date: "2024-03-10"
          relationships:
            measures:
              - pv-av-0001
              - bat-av-0001

  # ---------------------------------------------------------------------------
  # PROSUMER - PV only (no storage)
  # ---------------------------------------------------------------------------
  # A simpler prosumer setup with just PV and meter.

  av-0002:
    user_id: "POD-IT000E012345679"
    name: Sam Lee
    role: prosumer
    area: av_south
    status: active

    assets:
      pv:
        pv-av-0002:
          name: Balcony PV Panels
          rated_power: 0.8 # Small balcony system
          panel_type: monocrystalline
          orientation: 160 # South-southwest
          tilt_angle: 35
          installation_date: "2024-06-01"
          relationships:
            measures:
              - meter-av-0002

      meter:
        meter-av-0002:
          name: Smart Meter M-0002
          sensor_id: sensor-abc-002
          meter_type: bidirectional
          protocol: dlms
          installation_date: "2024-05-15"
          relationships:
            measures:
              - pv-av-0002

  # ---------------------------------------------------------------------------
  # CONSUMER - No generation assets
  # ---------------------------------------------------------------------------
  # A pure consumer with only a consumption meter.

  av-0003:
    user_id: "POD-IT000E012345680"
    name: Jordan Chen
    role: consumer
    area: av_south
    status: active

    assets:
      meter:
        meter-av-0003:
          name: Smart Meter M-0003
          sensor_id: sensor-abc-003
          meter_type: consumption
          protocol: dlms
          installation_date: "2024-01-20"
          relationships:
            measures: []

  # ---------------------------------------------------------------------------
  # PROSUMER - With EV Charger
  # ---------------------------------------------------------------------------
  # A prosumer with PV and an EV charging station.

  av-0004:
    user_id: "POD-IT000E012345681"
    name: Morgan Taylor
    role: prosumer
    area: av_north
    status: active

    assets:
      pv:
        pv-av-0004:
          name: Carport PV System
          rated_power: 8.0
          panel_type: monocrystalline
          orientation: 180
          tilt_angle: 15 # Low tilt for carport
          installation_date: "2023-09-01"
          relationships:
            measures:
              - meter-av-0004

      # -----------------------------------------------------------------------
      # EV Charger
      # -----------------------------------------------------------------------
      # Electric vehicle charging station.
      #
      # Fields:
      #   name: Display name
      #   max_power: Maximum charging power in kW
      #   charger_type: Charger level/type
      #                 Values: ac_level1 | ac_level2 | dc_fast | dc_ultra_fast
      #   connector_types: List of available connectors
      #                    Values: type1 | type2 | ccs | chademo | tesla
      #   smart_charging: Supports smart/controlled charging (boolean)
      #   bidirectional: Supports vehicle-to-grid V2G (boolean)
      #   installation_date: When installed (YYYY-MM-DD)
      #   relationships.measures: Asset keys that measure this charger

      ev_charger:
        evse-av-0004:
          name: Home EV Charger
          max_power: 11.0
          charger_type: ac_level2
          connector_types:
            - type2
          smart_charging: true
          bidirectional: false
          installation_date: "2023-09-15"
          relationships:
            measures:
              - meter-av-0004

      meter:
        meter-av-0004:
          name: Smart Meter M-0004
          sensor_id: sensor-abc-004
          meter_type: bidirectional
          protocol: mqtt
          installation_date: "2023-08-20"
          relationships:
            measures:
              - pv-av-0004
              - evse-av-0004

  # ---------------------------------------------------------------------------
  # PROSUMER - With Heat Pump
  # ---------------------------------------------------------------------------
  # A prosumer with PV and a heat pump for heating/cooling.

  av-0005:
    user_id: "POD-IT000E012345682"
    name: Casey Williams
    role: prosumer
    area: av_north
    status: active

    assets:
      pv:
        pv-av-0005:
          name: Roof PV System
          rated_power: 5.0
          panel_type: polycrystalline
          orientation: 170
          tilt_angle: 25
          installation_date: "2022-05-10"
          relationships:
            measures:
              - meter-av-0005

      # -----------------------------------------------------------------------
      # Heat Pump
      # -----------------------------------------------------------------------
      # Heat pump for space heating and/or cooling.
      #
      # Fields:
      #   name: Display name
      #   thermal_power: Nominal heating/cooling power in kW
      #   electrical_power: Nominal electrical consumption in kW
      #   cop: Coefficient of Performance (heating mode efficiency)
      #   eer: Energy Efficiency Ratio (cooling mode efficiency)
      #   heat_pump_type: Heat source type
      #                   Values: air_to_air | air_to_water | ground_source | water_source
      #   reversible: Can provide both heating and cooling (boolean)
      #   installation_date: When installed (YYYY-MM-DD)
      #   relationships.measures: Asset keys that measure this heat pump

      heat_pump:
        hp-av-0005:
          name: Air Source Heat Pump
          thermal_power: 8.0
          electrical_power: 2.5
          cop: 3.2
          eer: 2.8
          heat_pump_type: air_to_water
          reversible: true
          installation_date: "2022-06-01"
          relationships:
            measures:
              - meter-av-0005

      meter:
        meter-av-0005:
          name: Smart Meter M-0005
          sensor_id: sensor-abc-005
          meter_type: bidirectional
          protocol: dlms
          installation_date: "2022-04-15"
          relationships:
            measures:
              - pv-av-0005
              - hp-av-0005

  # ---------------------------------------------------------------------------
  # PROSUMER - Industrial with Controllable Load
  # ---------------------------------------------------------------------------
  # A commercial/industrial member with PV and controllable loads.

  av-0006:
    user_id: "VAT-IT12345678901"
    name: Aurora Manufacturing Co.
    role: prosumer
    area: av_industrial
    status: active

    assets:
      pv:
        pv-av-0006:
          name: Warehouse Rooftop PV
          rated_power: 50.0
          panel_type: monocrystalline
          orientation: 180
          tilt_angle: 10
          installation_date: "2023-01-15"
          relationships:
            measures:
              - meter-av-0006-pv

      storage:
        bat-av-0006:
          name: Industrial Battery System
          capacity: 100.0
          max_charge_power: 50.0
          max_discharge_power: 50.0
          battery_type: lithium_ion
          round_trip_efficiency: 90
          installation_date: "2023-02-01"
          relationships:
            measures:
              - meter-av-0006-storage
            paired_with: pv-av-0006

      # -----------------------------------------------------------------------
      # Controllable Load
      # -----------------------------------------------------------------------
      # A load that can be controlled for demand response.
      #
      # Fields:
      #   name: Display name
      #   load_type: Type of load
      #              Values: hvac | lighting | appliance | industrial | other
      #   rated_power: Nominal power consumption in kW
      #   controllable: Can be controlled for demand response (boolean)
      #   priority: Load priority for curtailment
      #             Values: critical | high | medium | low
      #   relationships.measures: Asset keys that measure this load

      load:
        load-av-0006-hvac:
          name: HVAC System
          load_type: hvac
          rated_power: 25.0
          controllable: true
          priority: medium
          relationships:
            measures:
              - meter-av-0006-main

        load-av-0006-production:
          name: Production Line Motors
          load_type: industrial
          rated_power: 80.0
          controllable: true
          priority: high # Production is important but can be shifted
          relationships:
            measures:
              - meter-av-0006-main

      # Multiple meters for sub-metering
      meter:
        meter-av-0006-main:
          name: Main Grid Meter
          sensor_id: sensor-ind-001-main
          meter_type: bidirectional
          protocol: modbus
          installation_date: "2023-01-01"
          relationships:
            measures:
              - load-av-0006-hvac
              - load-av-0006-production

        meter-av-0006-pv:
          name: PV Production Meter
          sensor_id: sensor-ind-001-pv
          meter_type: production
          protocol: modbus
          installation_date: "2023-01-15"
          relationships:
            measures:
              - pv-av-0006

        meter-av-0006-storage:
          name: Battery Meter
          sensor_id: sensor-ind-001-bat
          meter_type: bidirectional
          protocol: modbus
          installation_date: "2023-02-01"
          relationships:
            measures:
              - bat-av-0006

  # ---------------------------------------------------------------------------
  # CONSUMER - Pending approval
  # ---------------------------------------------------------------------------
  # A new member waiting for approval.

  av-0007:
    user_id: "POD-IT000E012345683"
    name: Riley Johnson
    role: consumer
    area: av_south
    status: pending

    assets:
      meter:
        meter-av-0007:
          name: Smart Meter M-0007
          sensor_id: sensor-abc-007
          meter_type: consumption
          installation_date: "2025-02-01"
          relationships:
            measures: []

  # ---------------------------------------------------------------------------
  # PROSUMER - Suspended membership
  # ---------------------------------------------------------------------------
  # A member with temporarily suspended status (e.g., payment issues).

  av-0008:
    user_id: "POD-IT000E012345684"
    name: Quinn Adams
    role: prosumer
    area: av_north
    status: suspended

    assets:
      pv:
        pv-av-0008:
          name: Garage PV System
          rated_power: 3.2
          panel_type: thin_film
          orientation: 200
          tilt_angle: 20
          installation_date: "2024-01-10"
          relationships:
            measures:
              - meter-av-0008

      meter:
        meter-av-0008:
          name: Smart Meter M-0008
          sensor_id: sensor-abc-008
          meter_type: bidirectional
          protocol: dlms
          installation_date: "2024-01-05"
          relationships:
            measures:
              - pv-av-0008
