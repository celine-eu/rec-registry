version: "3"

tasks:
  run:
    desc: Run
    cmds:
      - .venv/bin/uvicorn celine.rec_registry.main:create_app --host 0.0.0.0 --port 8004 --reload

  debug:
    desc: Debug
    cmds:
      - DEBUG_ATTACH=nowait DEBUG_PORT=48004 .venv/bin/uvicorn celine.rec_registry.main:create_app --host 0.0.0.0 --port 8004 --reload

  db:reset:
    desc: Drop and recreate Postgres volume (DANGEROUS)
    cmds:
      - docker compose down -v
      - docker compose up -d db

  db:migrate:
    desc: Apply Alembic migrations (upgrade head)
    cmds:
      - "uv run alembic upgrade head"

  db:revision:
    desc: "Create a new Alembic revision (autogenerate). Usage: task db:revision -- -m <message>"
    cmds:
      - "uv run alembic revision --autogenerate {{.CLI_ARGS}}"

  import:community:
    desc: "Import a community YAML (REPLACE mode). Usage: task import:community -- --file path.yaml"
    cmds:
      - "uv run celine-rec-registry import --client-id celine-cli --client-secret celine-cli {{.CLI_ARGS}}"

  import:community:example:
    desc: "Import the example community YAML"
    cmds:
      - task import:community -- --file recs/rec-example.yaml

  release:
    cmds:
      - uv run semantic-release -v version --no-vcs-release
      - git push
      - git push --tags
